version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: project-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: naumen
      POSTGRES_USER: project
      POSTGRES_PASSWORD: project
    volumes:
      - project_pg_data:/var/lib/postgresql/data

volumes:
  project_pg_data: