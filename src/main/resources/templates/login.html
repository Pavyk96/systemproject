<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 40px auto;
            line-height: 1.4;
        }
        form {
            display: grid;
            gap: 12px;
        }
        label {
            display: grid;
            gap: 4px;
        }
        .message {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .ok {
            background: #eaf7ea;
        }
        .error {
            background: #fdeaea;
        }
    </style>
</head>
<body>
<h1>Login</h1>
<div th:if="${param.registered}" class="message ok">Registration completed. You can sign in now.</div>
<div th:if="${param.error}" class="message error">Invalid login or password.</div>
<div th:if="${param.logout}" class="message ok">You have been logged out.</div>
<form th:action="@{/login}" method="post">
    <label>
        Username
        <input type="text" name="username" required>
    </label>
    <label>
        Password
        <input type="password" name="password" required>
    </label>
    <button type="submit">Sign in</button>
</form>
<p><a th:href="@{/register}">Create account</a></p>
</body>
</html>
