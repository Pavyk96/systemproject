<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Task form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            line-height: 1.4;
        }
        form {
            display: grid;
            gap: 12px;
        }
        label {
            display: grid;
            gap: 4px;
        }
        textarea {
            min-height: 140px;
        }
        .error {
            color: #b00020;
            font-size: 14px;
        }
    </style>
</head>
<body>
<h1 th:text="${formTitle}">Task form</h1>
<form th:action="${formAction}" th:object="${taskRequest}" method="post">
    <div class="error" th:if="${formError}" th:text="${formError}"></div>
    <label>
        Name
        <input type="text" th:field="*{name}" required>
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </label>
    <label>
        Description
        <textarea th:field="*{description}" required></textarea>
        <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </label>
    <label>
        Project
        <select th:field="*{projectId}" required>
            <option value="">Select project</option>
            <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}"></option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></span>
    </label>
    <label>
        Assignee
        <select th:field="*{assigneeId}">
            <option value="">Unassigned</option>
            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
        </select>
    </label>
    <div>
        <button type="submit" th:text="${submitLabel}">Save</button>
        <a th:href="@{/tasks}">Back</a>
    </div>
</form>
</body>
</html>
