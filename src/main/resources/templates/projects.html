<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            line-height: 1.4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }
        .members {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .member-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            border: 1px solid #ccc;
        }
        .stack {
            display: grid;
            gap: 8px;
        }
        form.inline {
            display: inline;
        }
    </style>
</head>
<body>
<div class="topbar">
    <h1>Projects</h1>
    <a th:href="@{/}">Home</a>
    <a th:if="${isAdmin}" th:href="@{/projects/new}">Create project</a>
</div>

<p th:if="${isAdmin}">Administrator view: all projects and membership management.</p>
<p th:unless="${isAdmin}">User view: projects where you are a participant.</p>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Members</th>
        <th th:if="${isAdmin}">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(projects)}">
        <td th:colspan="${isAdmin} ? 4 : 3">No projects yet.</td>
    </tr>
    <tr th:each="project : ${projects}">
        <td th:text="${project.name}"></td>
        <td th:text="${project.description}"></td>
        <td>
            <div class="stack">
                <div class="members" th:if="${!#lists.isEmpty(project.members)}">
                    <div class="member-actions" th:each="member : ${project.members}">
                        <span th:text="${member.username}"></span>
                        <form class="inline" th:if="${isAdmin}"
                              th:action="@{/projects/{projectId}/members/{userId}/remove(projectId=${project.id}, userId=${member.id})}"
                              method="post">
                            <button type="submit">Remove</button>
                        </form>
                    </div>
                </div>
                <span th:if="${#lists.isEmpty(project.members)}">No members</span>
                <form th:if="${isAdmin}" th:action="@{/projects/{id}/members(id=${project.id})}" method="post">
                    <select name="userId">
                        <option th:each="user : ${allUsers}" th:value="${user.id}" th:text="${user.username}"></option>
                    </select>
                    <button type="submit">Add member</button>
                </form>
            </div>
        </td>
        <td th:if="${isAdmin}">
            <div class="stack">
                <a th:href="@{/projects/{id}/edit(id=${project.id})}">Edit</a>
                <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
